# On every push (goreleaser's included): add this bucket on a Windows
# runner, install dakort with Scoop the way a person would, and run it.
name: install
on:
  push:
  workflow_dispatch:

jobs:
  scoop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          $env:Path = "$env:USERPROFILE\scoop\shims;$env:Path"
          scoop bucket add dakort "$PWD"
          scoop install dakort
          dakort -version
          scoop uninstall dakort
