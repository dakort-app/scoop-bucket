# On every push (goreleaser's included): add this bucket on a Windows
# runner the way a person would (by its URL; Scoop refuses a local
# folder), install dakort with Scoop, and run it.
name: install
on:
  push:
  workflow_dispatch:

jobs:
  scoop:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          $env:Path = "$env:USERPROFILE\scoop\shims;$env:Path"
          scoop bucket add dakort https://github.com/dakort-app/scoop-bucket
          scoop install dakort
          dakort -version
          scoop uninstall dakort
